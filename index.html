<!doctype html>
<html lang="en">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "RecordLabel",
    "name": "GATO Music",
    "alternateName": ["GATO Records", "GATO"],
    "url": "https://gatomusic.ch"
  }
  </script>
<head>
  <meta charset="UTF-8" />
  
  <!-- CONFIGURATION MOBILE & COULEUR DU NAVIGATEUR -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#A81A1A" /> <!-- La barre de recherche Safari sera rouge GATO -->

  <title>GATO</title>
  
  <!-- SEO DE BASE (Ce que lisent les IA et Google) -->
  <meta name="description" content="GATO is an independent record label, artist collective, and management based in Switzerland. We push emerging talents and build rich artistic universes." />
  <meta name="keywords" content="GATO Records, GATO Music, GATO, record label, switzerland, music, artists, independent label, underground music" />
  <meta name="author" content="GATO" />

  <!-- OPEN GRAPH (Les jolis encarts sur Discord, iMessage, LinkedIn, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GATO Music" />
  <meta property="og:title" content="GATO" />
  <meta property="og:description" content="Independent record label and artist collective based in Switzerland." />
  <!-- IMPORTANT : Mets une image (ex: 1200x630px) dans ton dossier public et nomme-la "gato-og.png" -->
  <meta property="og:image" content="/gato-og.png" /> 

  <!-- TWITTER CARDS -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GATO" />
  <meta name="twitter:description" content="Independent record label and artist collective based in Switzerland." />
  <meta name="twitter:image" content="/gato-og.png" />

  <!-- ICONES (Favicon PC & Icone Écran d'accueil iPhone/Android) -->
  <!-- Assure-toi d'avoir un fichier favicon.png et apple-touch-icon.png dans ton dossier 'public' -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- POLICES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
